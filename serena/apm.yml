name: serena
version: 1.0.0
description: APM project for serena
author: Jos Hendriks
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: copilot, claude, cursor, opencode, codex, gemini, windsurf, all
targets:
- copilot
dependencies:
  apm: []
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: serena
      args: [ "start-mcp-server", "--project-from-cwd" ]
includes: auto
scripts: {}
